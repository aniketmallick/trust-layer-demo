function updChips(t){
  const live = D.chips.filter(c => c[0] <= t && t - c[0] < 4).slice(-2), key = live.map(c => c[0] + c[1]).join("|"); if(key === chipKey) return; chipKey = key;
  const b = $("badge"); $("chips").style.top = (b.offsetTop + b.offsetHeight + 2) + "px";
  $("chips").innerHTML = live.map(c => `<span class="chip ${c[2]}">${esc(c[1])}</span>`).join("");
}
function updCut(t){
  const c = cutsNow().find(([a, b]) => a < t && t < b), el = $("cutnote");
  if(!c){ el.style.display = "none"; return; }
  el.style.display = "block"; el.textContent = `✂ ${fmtDur(c[1] - c[0])} with no row in the chain, played in ${D.cut_show_s} s: nothing was commanded (every command is a step row). C plays it at real time.`;
}
const logEl = $("log"); let shown = 0;
function updLog(t){
  const n = last(D.log, t, l => l[0]) + 1; if(n === shown) return;
  if(n < shown){ logEl.innerHTML = ""; shown = 0; }
  const frag = document.createDocumentFragment();
  for(let i = shown; i < n; i++){ const [lt, cls, txt] = D.log[i], d = document.createElement("div"); d.className = `ln ${cls}` + (n - shown < 6 && lt >= 0 && !REC ? " new" : "");
    d.innerHTML = `<span class="lt">${lt < 0 ? " pre   " : "+" + fmt(lt)}</span>${esc(txt)}`; d.title = txt; frag.appendChild(d); }
  logEl.appendChild(frag); shown = n; while(logEl.children.length > 120){ logEl.removeChild(logEl.firstChild); } logEl.scrollTop = logEl.scrollHeight;
}

// ---- playback
let tau = Q.has("t") ? tauOf(+Q.get("t")) : 0, playing = false, speed = [1, 2, 4].includes(+Q.get("speed")) ? +Q.get("speed") : 1, wall = 0, dirty = true;
const scrub = $("scrub"); scrub.max = TAU_END.toFixed(2);
function setSpeed(s){ speed = s; document.querySelectorAll("#ctl [data-s]").forEach(b => b.classList.toggle("on", +b.dataset.s === s)); }
function setPlay(p){ playing = p && tau < TAU_END; wall = performance.now(); $("play").innerHTML = playing ? "&#10074;&#10074; Pause" : "&#9654; Play"; }
function seek(v){ tau = Math.max(0, Math.min(TAU_END, v)); wall = performance.now(); dirty = true; }
function nextEvent(){ const t = tOf(tau) + 0.05, ts = [...D.track.map(b => b[0]), ...D.over.map(o => o[0]), ...D.chips.map(c => c[0]), ...D.events.map(e => e.t)].filter(x => x > t).sort((a, b) => a - b);
  if(ts.length) seek(tauOf(ts[0]) - 0.3); }
$("play").onclick = () => { if(tau >= TAU_END) seek(0); setPlay(!playing); };
document.querySelectorAll("#ctl [data-s]").forEach(b => b.onclick = () => setSpeed(+b.dataset.s));
scrub.oninput = () => seek(+scrub.value);
addEventListener("keydown", e => {
  if(e.target.tagName === "INPUT" && e.key !== " ") return;
  const k = e.key.toLowerCase();
  if(e.key === " "){ e.preventDefault(); if(tau >= TAU_END) seek(0); setPlay(!playing); }
  else if(e.key === "ArrowRight") seek(tau + 5); else if(e.key === "ArrowLeft") seek(tau - 5);
  else if(k === "n") nextEvent(); else if(k === "r") seek(0); else if(k === "h") $("ctl").classList.toggle("hide");
  else if(k === "c"){ const t = tOf(tau); useCuts = !useCuts; TAU_END = tauOf(D.t_end); scrub.max = TAU_END.toFixed(2); drawStatic(); seek(tauOf(t)); }
  else if(["1", "2", "4"].includes(e.key)) setSpeed(+e.key);
});
function frame(now){
  // a hidden tab pauses the playback (at most 0.25 s per frame), it never jumps ahead
  if(playing){ tau += Math.min(0.25, Math.max(0, now - wall) / 1000) * speed; wall = now; if(tau >= TAU_END){ tau = TAU_END; setPlay(false); } dirty = true; }
  if(dirty){ const t = tOf(tau); draw3(t); drawTL(t); updBadge(t); updChips(t); updCut(t); updLog(t);
    $("ct").textContent = "+" + fmt(t); $("cw").textContent = `${wallAt(t)} · ${speed}×`; scrub.value = tau.toFixed(2);
    $("ctime").textContent = `${fmt(t)} / ${fmt(D.t_end)}`; dirty = playing; }
  requestAnimationFrame(frame);
}
setSpeed(speed); setPlay(Q.has("autoplay")); requestAnimationFrame(frame);
</script>
